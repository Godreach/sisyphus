[workspace]
resolver = "2"
members = [
    "sisyphus-proto",
    "sisyphus-model",
    "sisyphus-server",
    "sisyphus-agent",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["sisyphus contributors"]
repository = "https://github.com/Godreach/sisyphus"

[workspace.dependencies]
# serde family — shared by model / server / agent
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio runtime
tokio = { version = "1", features = ["full"] }
# proto (Agent/Server 唯一共享契约)
tonic = { version = "0.14", features = ["transport"] }
prost = "0.14"
# cli
clap = { version = "4", features = ["derive"] }
# async runtime helpers
futures = "0.3"
tracing = "0.1"
# server 配置与日志（ADR-0010/0019）
toml = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# server 存储：SQLite WAL + sqlx（bundled 静态链接，ADR-0004）
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
# server REST 面（ADR-0005：axum + utoipa + Swagger UI）。
# utoipa 注解钉 5（spec 决策）；utoipa-swagger-ui 走 9 线——
# 本仓镜像源缺 5.1–5.3（axum 0.8 支持起始版），9.x 与 utoipa 5 + axum 0.8 成对。
# vendored：Swagger UI 资产随 crate 预置，构建期零网络下载（CI 可重现）。
axum = "0.8"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }
# 进程内集成测试：oneshot 驱动 Router + 读响应体
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# 静态资源内嵌（ADR-0005：release 编译期嵌入 / debug 运行时读盘）
rust-embed = "8"
# URL 路径百分号解码（静态资源路径清洗用）
percent-encoding = "2"
# 认证（ADR-0014）：argon2id 密码哈希——纯 Rust、交叉编译友好（bcrypt 类
# C 依赖是 6 目标交叉编译链风险）
argon2 = "0.5"
# session id 落库只存 SHA-256（库泄露 ≠ 会话劫持，与 PAT 同纪律）
sha2 = "0.10"
# session id 的 base64url 无填充编码（argon2 传递依赖同族，不新增树体积）
base64ct = "1"
# argon2 盐与 session id 的 OS 随机源（rand_core 0.6 与 password-hash 同线；
# 需自带 getrandom feature——password-hash 的再导出未启用它）
rand_core = { version = "0.6", features = ["getrandom"] }
# 机密值加密（ADR-0015）：XChaCha20-Poly1305——纯 Rust、无 AES 硬件依赖、
# 192 位随机 nonce 免 nonce 管理重用风险（RustCrypto 系，与 argon2 同族）
chacha20poly1305 = "0.10"
# cron 定时触发（票 B2c-T6，ADR-0016）：cron 表达式解析/匹配，纯 Rust。
# 依赖 chrono（clock feature，纯 Rust 跨编译友好），trigger 模块用于
# 「表达式按节奏扫表」的下次/上次命中求值。
cron = "0.17"
# 日期时间（cron 的传递依赖；trigger 模块直接消费——Unix 毫秒 ↔ DateTime
# 转换、cron 命中点迭代）。default-features=false + clock 与 cron 同线
# （共享同一 chrono），避免引入第二份。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[workspace.lints.rust]
# unsafe 降为 warn：vendored protoc 的 build.rs 需 set_var（1.97 起为 unsafe），
# forbid 会阻塞这一标准构建模式；warn 仍能暴露任何 unsafe 供评审。
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
