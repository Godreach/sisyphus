<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="180" viewBox="0 0 1360 180" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sisyphus — A 方案白字 LOGO</title>
  <desc id="desc">左侧为白底 A 方案机器人图标，右侧为白色 SISYPHUS 字标，整体背景透明。</desc>
  <defs>
    <linearGradient id="blue" x1="25" y1="111" x2="91" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0061FF"/>
      <stop offset="1" stop-color="#0085FF"/>
    </linearGradient>
    <linearGradient id="teal" x1="125" y1="49" x2="61" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D5BB"/>
      <stop offset="1" stop-color="#00BEB7"/>
    </linearGradient>
    <linearGradient id="shell" x1="78" y1="61" x2="78" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F2F8"/>
    </linearGradient>
  </defs>
  <g transform="translate(10 10)">
  <rect width="160" height="160" rx="30" fill="#FFFFFF"/>
  <!-- The two open circular arrows have square ends beneath the round nodes. -->
  <path d="M42.6 120.1 A50.5 50.5 0 0 1 82 31.1" stroke="url(#blue)" stroke-width="14"/>
  <path d="M81 19.1 Q81 17.5 82.5 18.6 L99.2 31.6 Q100.4 32.6 99.1 33.6 L82.5 46.3 Q81 47.4 81 45.7 Z" fill="#0083FF"/>
  <path d="M113.7 43.6 A50.5 50.5 0 0 1 77 130.5" stroke="url(#teal)" stroke-width="14"/>
  <path d="M77.7 118.6 Q77.7 117.1 76.4 118.1 L59.6 130.8 Q58.3 131.8 59.6 132.8 L76.3 145 Q77.7 146.1 77.7 144.4 Z" fill="#00C4B8"/>
  <!-- White separation around the nodes matches the white application icon. -->
  <circle cx="111.4" cy="43.4" r="13.2" fill="#FFFFFF"/>
  <circle cx="111.4" cy="43.4" r="11.5" fill="#0072FF"/>
  <circle cx="111.4" cy="43.4" r="5.6" fill="#FFFFFF"/>
  <circle cx="46.7" cy="120.4" r="13.1" fill="#FFFFFF"/>
  <circle cx="46.7" cy="120.4" r="11.6" fill="#0072FF"/>
  <circle cx="46.7" cy="120.4" r="5.6" fill="#FFFFFF"/>
  <!-- Robot antenna, ears, shell and inset face are independent vector shapes. -->
  <path d="M78.9 62.7 V53.2" stroke="#001A35" stroke-width="3.5"/>
  <circle cx="78.9" cy="51.9" r="5.2" fill="#0083FF"/>
  <rect x="42.6" y="75.1" width="12.3" height="20.3" rx="6.1" fill="#001A35"/>
  <rect x="102.7" y="75.1" width="12.3" height="20.3" rx="6.1" fill="#001A35"/>
  <rect x="47.6" y="62" width="62.7" height="46.6" rx="23.3" fill="url(#shell)" stroke="#001A35" stroke-width="3.5"/>
  <rect x="53.1" y="71.8" width="51.6" height="29.9" rx="14.95" fill="#001A35"/>
  <circle cx="67.6" cy="86.4" r="5.35" fill="#00C9F0"/>
  <circle cx="90.3" cy="86.4" r="5.35" fill="#00C9F0"/>
  </g>
  <text x="218" y="155" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="180" font-weight="900" letter-spacing="1" textLength="1008" lengthAdjust="spacingAndGlyphs">SISYPHUS</text>
</svg>
