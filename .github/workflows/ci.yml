name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # vendored protoc：无需系统 protoc（ADR-0009）
      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # sisyphus-codegen 对账校验（票 B4-T7，ADR-0009）：sisyphus-model → TS 生成产物
      # （src/model/pipeline.ts 等）与 model 当前形态一致——model 改后未 gen 或
      # 生成产物被手改即红。自检（样本码 multiset）已由 `cargo test --workspace` 覆盖。
      - name: 对账（生成产物未漂移）
        run: cargo run -p sisyphus-codegen -- check

  # 提交信息规范校验（Conventional Commits，零依赖 bash）：PR 校验全部新增
  # 提交、push 校验本次推送的提交，复用 .githooks/lint-commits（本地
  # commit-msg hook 同款逻辑）。规则见 docs/agents/commit-messages.md。
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # range 计算需 base/before 可达，全历史
      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" 2>/dev/null || true   # 双保险
            range="origin/$BASE_REF..HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD"          # 新分支回退单条
          else
            range="$BEFORE..HEAD"  # push：本次推送的提交
          fi
          bash .githooks/lint-commits "$range"

  # Agent 全平台矩阵（票 B3-T10 / #55，ADR-0010 发布矩阵 Linux/Windows）：
  # agent 只依赖 sisyphus-proto（vendored protoc 跨平台），不拉 server，故可在
  # Windows 上独立构建/测试。docker 门控用例 `#[ignore]` 由 `cargo test` 默认跳过
  # （需 `--ignored` 手动跑），故矩阵天然排除 docker 依赖、CI 确定性绿。
  agent-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build agent
        run: cargo build -p sisyphus-agent

      - name: Test agent（#[ignore] docker 用例默认跳过）
        run: cargo test -p sisyphus-agent

      - name: Clippy agent
        run: cargo clippy -p sisyphus-agent -- -D warnings

  # 前端工程（票 B4-T1，ADR-0003/0020）：vue-tsc 类型 + vitest 行为测试 +
  # i18n 对账（zh 源语言/en 全量对译，key 集合一致）挂在依赖锁定（npm ci
  # 按 package-lock.json）与构建（产物进 dist/，server rust-embed 内嵌目录）。
  # 构建用 npm run build（vue-tsc -b && vite build）保证类型检查也覆盖构建面。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisyphus-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sisyphus-web/package-lock.json

      - name: Install dependencies（按锁文件）
        run: npm ci

      - name: vue-tsc 类型检查
        run: npm run typecheck

      - name: vitest 行为测试
        run: npm test

      - name: i18n 对账（zh/en key 集合一致）
        run: npm run i18n:check

      - name: 构建产物进 dist/
        run: npm run build

      # headless 冒烟（票 B4-T9 / #71）：构建产物 + 预览端口点击走通 12 页主
      # 路径。playwright 在真实浏览器里驱动 SPA——测 jsdom/vitest 覆盖不到的
      # 构建/路由/历史 API 面；后端经 page.route 拦截 /api/v1/** 注入 mock
      # （不拉真后端——数据往返由 Rust web_handshake.rs 进程内 oneshot 兜底，
      # 那条缝才守「不起 socket/进程」纪律；本冒烟为真实浏览器驱动，起预览端口
      # 与浏览器进程是原型 scripts/smoke.mjs 同款「预览端口点击」形态）。chromium
      # 浏览器二进制随 playwright npm 包单独下载（npm ci 只装 API）。
      - name: 安装 playwright chromium
        run: npx playwright install --with-deps chromium

      - name: headless 冒烟 12 页主路径
        run: npm run smoke
