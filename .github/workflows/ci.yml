name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # vendored protoc：无需系统 protoc（ADR-0009）
      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # sisyphus-codegen 对账校验（票 B4-T7，ADR-0009）：sisyphus-model → TS 生成产物
      # （src/model/pipeline.ts 等）与 model 当前形态一致——model 改后未 gen 或
      # 生成产物被手改即红。自检（样本码 multiset）已由 `cargo test --workspace` 覆盖。
      - name: 对账（生成产物未漂移）
        run: cargo run -p sisyphus-codegen -- check

  # 提交信息规范校验（Conventional Commits，零依赖 bash）：PR 校验全部新增
  # 提交、push 校验本次推送的提交，复用 .githooks/lint-commits（本地
  # commit-msg hook 同款逻辑）。规则见 docs/agents/commit-messages.md。
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # range 计算需 base/before 可达，全历史
      - name: Lint commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" 2>/dev/null || true   # 双保险
            range="origin/$BASE_REF..HEAD"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD"          # 新分支回退单条
          else
            range="$BEFORE..HEAD"  # push：本次推送的提交
          fi
          bash .githooks/lint-commits "$range"

  # Agent 全平台矩阵（票 B3-T10 / #55，ADR-0010 发布矩阵 Linux/Windows）：
  # agent 只依赖 sisyphus-proto（vendored protoc 跨平台），不拉 server，故可在
  # Windows 上独立构建/测试。docker 门控用例 `#[ignore]` 由 `cargo test` 默认跳过
  # （需 `--ignored` 手动跑），故矩阵天然排除 docker 依赖、CI 确定性绿。
  agent-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build agent
        run: cargo build -p sisyphus-agent

      - name: Test agent（#[ignore] docker 用例默认跳过）
        run: cargo test -p sisyphus-agent

      - name: Clippy agent
        run: cargo clippy -p sisyphus-agent -- -D warnings

  # 前端工程（票 B4-T1，ADR-0003/0020）：vue-tsc 类型 + vitest 行为测试 +
  # i18n 对账（zh 源语言/en 全量对译，key 集合一致）挂在依赖锁定（npm ci
  # 按 package-lock.json）与构建（产物进 dist/，server rust-embed 内嵌目录）。
  # 构建用 npm run build（vue-tsc -b && vite build）保证类型检查也覆盖构建面。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisyphus-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sisyphus-web/package-lock.json

      - name: Install dependencies（按锁文件）
        run: npm ci

      - name: vue-tsc 类型检查
        run: npm run typecheck

      - name: vitest 行为测试
        run: npm test

      - name: i18n 对账（zh/en key 集合一致）
        run: npm run i18n:check

      - name: 构建产物进 dist/
        run: npm run build

      # headless 冒烟（票 B4-T9 / #71）：构建产物 + 预览端口点击走通 12 页主
      # 路径。playwright 在真实浏览器里驱动 SPA——测 jsdom/vitest 覆盖不到的
      # 构建/路由/历史 API 面；后端经 page.route 拦截 /api/v1/** 注入 mock
      # （不拉真后端——数据往返由 Rust web_handshake.rs 进程内 oneshot 兜底，
      # 那条缝才守「不起 socket/进程」纪律；本冒烟为真实浏览器驱动，起预览端口
      # 与浏览器进程是原型 scripts/smoke.mjs 同款「预览端口点击」形态）。chromium
      # 浏览器二进制随 playwright npm 包单独下载（npm ci 只装 API）。
      - name: 安装 playwright chromium
        run: npx playwright install --with-deps chromium

      - name: headless 冒烟 12 页主路径
        run: npm run smoke

      # dist 产物上传（rust-embed 编译期内嵌目录）：git 不再提交构建产物
      # （见 sisyphus-web/.gitignore），server 各构建 job（cross-compile /
      # release build-matrix / Dockerfile）经此 artifact 注入真实 dist 后再
      # cargo build——保证内嵌的是与源码一致的当前前端。
      - name: 上传 dist 产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: sisyphus-web/dist
          if-no-files-found: error

  # 6 目标原生构建验证（票 B5-T10 / #82，ADR-0022）：PR 级、仅 build（无 test/
  # clippy——已由 build-and-test 覆盖），取「轻者」（PR 级早反馈而非 nightly）。
  # 6 目标全用原生 runner（非 cross）：server 有 C 依赖（ring via lettre→rustls
  # + libsqlite3-sys）、agent 也有 C 依赖（aws-lc-sys via reqwest→rustls→
  # aws-lc-rs），ADR-0022 明确本地 Windows→Linux 交叉编译被 C 工具链阻断，
  # 6 目标原生构建由 CI 验证。仓库为 public → 6 个原生 runner 全免费可用。
  # 前端产物 git 不提交（sisyphus-web/.gitignore）：server 构建前下载
  # frontend job 的 web-dist artifact 注入真实 dist（rust-embed 编译期内嵌）。
  # 仅 pull_request 触发——避免与 tag push 时 release.yml 的构建矩阵重复跑。
  # 注：本 matrix.target 与 release.yml 的 build-matrix 同源（6 目标原生 runner）；
  # 加目标时两处同改——release.yml 为发布产物权威，此处为 CI 验证镜像。
  cross-compile-matrix:
    if: github.event_name == 'pull_request'
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        crate: [server, agent]
        target:
          - { runner: ubuntu-latest,   os: linux,   arch: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux,   arch: aarch64 }
          - { runner: macos-13,         os: macos,   arch: x86_64 }
          - { runner: macos-14,         os: macos,   arch: aarch64 }
          - { runner: windows-latest,   os: windows, arch: x86_64 }
          - { runner: windows-11-arm,   os: windows, arch: aarch64 }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.crate }}-${{ matrix.target.runner }}

      # server 构建需真实 dist（rust-embed 编译期内嵌）；agent 不需要前端。
      - name: 下载前端产物（server）
        if: matrix.crate == 'server'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: sisyphus-web/dist

      - name: Build（release，原生）
        run: cargo build --release -p sisyphus-${{ matrix.crate }}

