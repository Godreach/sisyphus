name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # vendored protoc：无需系统 protoc（ADR-0009）
      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  # Agent 全平台矩阵（票 B3-T10 / #55，ADR-0010 发布矩阵 Linux/Windows）：
  # agent 只依赖 sisyphus-proto（vendored protoc 跨平台），不拉 server，故可在
  # Windows 上独立构建/测试。docker 门控用例 `#[ignore]` 由 `cargo test` 默认跳过
  # （需 `--ignored` 手动跑），故矩阵天然排除 docker 依赖、CI 确定性绿。
  agent-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build agent
        run: cargo build -p sisyphus-agent

      - name: Test agent（#[ignore] docker 用例默认跳过）
        run: cargo test -p sisyphus-agent

      - name: Clippy agent
        run: cargo clippy -p sisyphus-agent -- -D warnings

  # 前端工程（票 B4-T1，ADR-0003/0020）：vue-tsc 类型 + vitest 行为测试 +
  # i18n 对账（zh 源语言/en 全量对译，key 集合一致）挂在依赖锁定（npm ci
  # 按 package-lock.json）与构建（产物进 dist/，server rust-embed 内嵌目录）。
  # 构建用 npm run build（vue-tsc -b && vite build）保证类型检查也覆盖构建面。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisyphus-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sisyphus-web/package-lock.json

      - name: Install dependencies（按锁文件）
        run: npm ci

      - name: vue-tsc 类型检查
        run: npm run typecheck

      - name: vitest 行为测试
        run: npm test

      - name: i18n 对账（zh/en key 集合一致）
        run: npm run i18n:check

      - name: 构建产物进 dist/
        run: npm run build
